[package]
name = "death-recap"
description = "Death Recap, a Flav-Toolkit add-on: who killed you in AION 2, with what, and what controlled you"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "death_recap"
path = "src/lib.rs"

[[bin]]
name = "death-recap"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
recap.workspace = true
armory.workspace = true
flav-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
flav-feed.workspace = true
flav-addons.workspace = true
flav-events.workspace = true
