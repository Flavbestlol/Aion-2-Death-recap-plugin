<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cinzel;src:url(../www/fonts/Cinzel.ttf)}
@font-face{font-family:Cap;font-weight:500;src:url(../www/fonts/BarlowSemiCondensed-Medium.ttf)}
@font-face{font-family:Cap;font-weight:600;src:url(../www/fonts/BarlowSemiCondensed-SemiBold.ttf)}
html,body{margin:0;background:#07090e}
.b{position:relative;width:1280px;height:400px;overflow:hidden;background:url(back.jpg) right 18% / cover}
.b::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,13,.92) 0%,rgba(6,8,13,.78) 38%,rgba(6,8,13,.2) 62%,rgba(6,8,13,0) 80%)}
.t{position:absolute;left:72px;top:58px;width:640px}
.eye{display:flex;align-items:center;gap:14px;font:600 17px Cap;letter-spacing:.24em;color:#f2c35b;text-transform:uppercase}
.eye img{width:54px;height:54px;filter:drop-shadow(0 0 12px rgba(220,40,40,.45))}
h1{margin:14px 0 0;font:700 78px/1 Cinzel;letter-spacing:.02em;color:#f3ead6;text-shadow:0 2px 24px rgba(0,0,0,.6)}
h1 span{color:#e8433a}
p{margin:16px 0 0;font:500 23px/1.35 Cap;color:#cfc6b2;max-width:560px}
.chips{display:flex;gap:10px;margin-top:22px}
.chips i{font:600 16px Cap;font-style:normal;color:#e9e1cc;padding:7px 15px;border-radius:999px;background:rgba(14,17,25,.75);box-shadow:inset 0 0 0 1px rgba(242,195,91,.35)}
.card{position:absolute;right:46px;bottom:34px;width:520px;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(242,195,91,.25);display:none}
.v2 .card{display:block}
</style></head><body>
<div class="b" id="b"><div class="t">
<div class="eye"><img src="../../../docs/emblem.png" alt="">AION 2 · Flav-Toolkit add-on</div>
<h1>Death <span>Recap</span></h1>
<p>Who killed you, with what, and what held you down, the moment you fall.</p>
<div class="chips"><i>Killer &amp; final blow</i><i>Every attacker</i><i>Crowd control</i><i>Their gear</i></div>
</div><img class="card" src="../out/details.png" alt=""></div>
</body></html>
