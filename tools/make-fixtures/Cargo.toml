# Turns the core's frame fixtures into the event fixtures Death Recap's tests
# read, and checks this repository's views against the built-in recap's. Needs a
# Flav-Toolkit checkout beside this repository, at the tag of the version below
# (`v0.19.1`), with the meter's parser synced (`python tools/sync_upstream.py` there). Not part of
# the workspace: CI never builds it.
[package]
name = "make-fixtures"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
flav-core = { path = "../../../flav-toolkit/crates/flav-core" }
recap = { path = "../../crates/recap" }
flav-events = { version = "0.19.1", registry = "flav" }
serde_json = "1"
