name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux libraries for the app (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: The class emblems (fetched, never committed)
        run: python tools/class_icons.py
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build death-recap.exe
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p death-recap
      - name: Keep death-recap.exe and its addon.json
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: death-recap-windows
          path: |
            target/release/death-recap.exe
            addon.json
          retention-days: 30
