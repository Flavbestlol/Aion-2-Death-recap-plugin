[workspace]
resolver = "3"
members = ["crates/recap", "crates/armory", "app"]
# Builds fixtures from the core's engine; needs a Flav-Toolkit checkout beside
# this one (see tools/make-fixtures/README.md).
exclude = ["tools"]

[workspace.package]
version = "0.3.5"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Flavbest"]
repository = "https://github.com/Flavbestlol/Aion-2-Death-recap-plugin"

[workspace.dependencies]
# Flav-Toolkit, the core: its crates for add-ons at a released version, from
# the registry on its download page (.cargo/config.toml). Upgrade on purpose;
# events only gain types and fields within a version, so an older version
# keeps working with a newer core.
flav-events = { version = "0.19.1", registry = "flav" }
flav-sdk = { version = "0.19.1", registry = "flav" }
flav-feed = { version = "0.19.1", registry = "flav" }
flav-addons = { version = "0.19.1", registry = "flav" }
recap = { path = "crates/recap" }
armory = { path = "crates/armory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
