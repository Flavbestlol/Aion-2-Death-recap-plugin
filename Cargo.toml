[workspace]
resolver = "3"
members = ["crates/recap", "crates/armory", "app"]
# Builds fixtures from the core's engine; needs a Flav-Toolkit checkout beside
# this one (see tools/make-fixtures/README.md).
exclude = ["tools"]

[workspace.package]
version = "0.3.5"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Flavbest"]
repository = "https://github.com/Flavbestlol/Aion-2-Death-recap-plugin"

[workspace.dependencies]
# Flav-Toolkit, the core, pinned by commit (affd84c, 0.12.0: events carry
# names and icons, buffs name the skill that applied them, the hub's `show`,
# `addon.json` may name the add-on's emblem, and the dock's `toggle`).
# Upgrade the pin on purpose; events only gain types and fields
# within a version, so an old pin keeps working with a newer core.
flav-events = { git = "https://github.com/Flavbestlol/flav-toolkit", rev = "58b7ffdec6f1699cf1f5226fd9024e8bc240ca5e" }
flav-sdk = { git = "https://github.com/Flavbestlol/flav-toolkit", rev = "58b7ffdec6f1699cf1f5226fd9024e8bc240ca5e" }
flav-feed = { git = "https://github.com/Flavbestlol/flav-toolkit", rev = "58b7ffdec6f1699cf1f5226fd9024e8bc240ca5e" }
flav-addons = { git = "https://github.com/Flavbestlol/flav-toolkit", rev = "58b7ffdec6f1699cf1f5226fd9024e8bc240ca5e" }
recap = { path = "crates/recap" }
armory = { path = "crates/armory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
